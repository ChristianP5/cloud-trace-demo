version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55681:55681"
    volumes:
      - ./otel-collector-config-gcp.yaml:/etc/otel-collector-config.yaml
    command: --config=/etc/otel-collector-config.yaml
    networks:
      - traces

networks:
  # The presence of these objects is sufficient to define them
  traces: {}